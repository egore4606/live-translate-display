name: Bug report
description: Report a reproducible problem with the display or relay
title: "bug: "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, cookies, recordings, personal data, or private server details.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the visible behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include browser/device and the shortest reproducible steps.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari on iPad, version ...
  - type: textarea
    id: checks
    attributes:
      label: Relevant checks or logs
      description: Redact secrets and personal data before attaching anything.
